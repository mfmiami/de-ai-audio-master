[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "de-ai-audio-master"
version = "2.1.0"
description = "Standalone local DSP tool and AI agent skill for cleaning technical artifacts in AI-generated tracks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "soundfile>=0.12.1",
]

[project.scripts]
deai-master = "deai_master.cli:main"
deai-master-ui = "deai_master.web_ui:main"

[tool.setuptools.packages.find]
include = ["deai_master*"]
